        body {

        /* Selection */

        /* Custom IDE-like Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        /* Prose / Markdown styling - Premium Look */
        .markdown-body { font-size: 0.95rem; }
        .markdown-body h1 { 
            font-size: 2.5rem; 
            font-weight: 700; 
            letter-spacing: -0.025em;
            color: #fff; 
            margin-bottom: 1.5rem; 
            background: linear-gradient(to right, #fff, #a1a1aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .markdown-body h2 { 
            font-size: 1.25rem; 
            font-weight: 600; 
            color: #f4f4f5; 
            margin-top: 2.5rem;

            padding-bottom: 0.5rem;

        .markdown-body ul { list-style-type: none; padding-left: 0; margin-bottom: 1.5rem; }
        .markdown-body li { 
            margin-bottom: 0.75rem; 
            position: relative; 
            padding-left: 1.5rem; 
            line-height: 1.6;
        }
        .markdown-body li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: #a855f7;
            font-size: 1.2rem;
            line-height: 1;
            top: 2px;
        }
        .markdown-body strong { color: #f4f4f5; font-weight: 600; }
        .markdown-body blockquote { 
            border-left: 2px solid #a855f7; 
            color: #d4d4d8; 
            font-style: italic; 
            background: linear-gradient(90deg, rgba(168,85,247,0.1) 0%, transparent 100%);
            padding: 1.25rem 1.5rem; 
            border-radius: 0 0.5rem 0.5rem 0; 
            margin-bottom: 1.5rem;
        }
        .markdown-body table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 1.5rem; margin-bottom: 1.5rem; }
        .markdown-body th, .markdown-body td { 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
            padding: 1rem 0.75rem; 
            text-align: left; 
        }
        .markdown-body th { color: #f4f4f5; font-weight: 500; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.05em; }
        
        .markdown-body code:not(pre code) {
            background: rgba(255,255,255,0.05);
            padding: 0.2em 0.4em;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85em;
            color: #d4d4d8;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Animation utilities */
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(10px); }

        /* Prevent body scroll when mobile menu is open */

        /* Glassmorphism utilities */
        .glass-panel {
            background: rgba(24, 24, 27, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>

Before making any significant changes, inspect the project documentation and relevant source code.

- Design system
- Architecture
- Database
- API contracts
- Security
- Code conventions
- Testing
- Agent behavior

                    html += `
                        <div class="glass-panel rounded-2xl p-6 fade-in" style="animation-delay: ${groupIndex * 50}ms">
                            <h3 class="text-brand-400 font-bold mb-5 uppercase tracking-[0.15em] text-xs flex items-center gap-2">
                                <i class="ph-duotone ph-target"></i> ${group.title}
                            </h3>
                            <div class="space-y-1">
                    `;
                    group.items.forEach(item => {
                        const isChecked = state.checklist[item.id] ? 'checked' : '';
                        const textClass = isChecked ? 'text-zinc-600 line-through' : 'text-zinc-300';
                        html += `
                            <label class="group flex items-start gap-4 cursor-pointer p-2 -mx-2 rounded-lg hover:bg-white/5 transition-colors">
                                <div class="relative flex items-center justify-center w-5 h-5 mt-0.5 rounded border border-white/20 bg-black/40 transition-colors duration-300 ${isChecked ? 'bg-brand-500 border-brand-500 shadow-glow' : 'group-hover:border-white/40'}">
                                    <input type="checkbox" id="${item.id}" class="task-checkbox" ${isChecked} onchange="app.toggleChecklist('${item.id}', this, this.nextElementSibling)">
                                    ${isChecked ? '<i class="ph-bold ph-check text-white text-xs"></i>' : ''}
                                </div>
                                <span class="text-sm select-none transition-all duration-300 ${textClass}">${item.label}</span>
                            </label>
                        `;
                    });
                    html += `</div></div>`;
                });
                container.innerHTML = html;
            },

            toggleChecklist: (id, inputEl, textEl) => {
                const isChecked = inputEl.checked;
                state.checklist[id] = isChecked;
                localStorage.setItem('vibeChecklist', JSON.stringify(state.checklist));
                uiHelpers.updateChecklistProgress();
                
                // Re-render the specific group to update the checkmark SVG smoothly
                app.renderChecklist();
            },

            navigate: (viewId) => {
                state.activeView = viewId;
                
                // Update active state in sidebar
                document.querySelectorAll('.nav-link').forEach(el => {
                    el.classList.remove('bg-brand-500/10', 'text-brand-400', 'active');
                    el.classList.add('text-slate-400');
                });
                const activeLink = document.getElementById(`nav-${viewId}`);
                if (activeLink) {
                    activeLink.classList.remove('text-slate-400');
                    activeLink.classList.add('bg-brand-500/10', 'text-brand-400', 'active');
                }

                // Render Content
                const stage = document.getElementById('contentStage');
                const scrollArea = document.getElementById('mainScroll');
                
                // Check if view is a document template
                if (docTemplates[viewId]) {
                    const doc = docTemplates[viewId];
                    stage.innerHTML = `
                        <div class="fade-in markdown-body">
                            <div class="mb-6 flex items-center gap-3">
                                <span class="bg-brand-500 text-slate-950 font-mono font-bold px-2 py-1 rounded text-sm">${doc.id}</span>
                                <h1 class="!mb-0 !mt-0">${doc.title}</h1>
                            </div>
                            <p class="text-lg text-slate-400 border-l-2 border-surface-800 pl-4 mb-8">${doc.desc}</p>
                            ${uiHelpers.createCodeBlock(doc.title, doc.content)}
                        </div>
                    `;
                } else if (contentDB[viewId]) {
                    // Render static view
                    stage.innerHTML = contentDB[viewId].render();
                    if(viewId === 'checklist') app.renderChecklist();
                }

                // Reset scroll and close mobile menu if open
                scrollArea.scrollTop = 0;
                if (window.innerWidth < 1024) {
                    app.toggleMobileMenu(false);
                }
            },

            renderChecklist: () => {
                const container = document.getElementById('checklistContainer');
                if(!container) return;
                
                let html = '';
                checklistData.forEach(group => {
                    html += `
                        <div class="bg-surface-900 border border-surface-800 rounded-xl p-6">
                            <h3 class="text-brand-400 font-bold mb-4 uppercase tracking-wider text-sm flex items-center gap-2">
                                <i class="ph ph-target"></i> ${group.title}
                            </h3>
                            <div class="space-y-3">
                    `;
                    group.items.forEach(item => {
                        const isChecked = state.checklist[item.id] ? 'checked' : '';
                        html += `
                            <div class="flex items-start gap-3">
                                <input type="checkbox" id="${item.id}" class="task-checkbox mt-1 w-4 h-4 rounded border-surface-700 bg-surface-950 text-brand-500 focus:ring-brand-500 focus:ring-offset-surface-900 cursor-pointer" ${isChecked} onchange="app.toggleChecklist('${item.id}', this.checked)">
                                <label for="${item.id}" class="text-sm cursor-pointer select-none leading-relaxed">${item.label}</label>
                            </div>
                        `;
                    });
                    html += `</div></div>`;
                });
                container.innerHTML = html;
            },

            toggleChecklist: (id, isChecked) => {
                state.checklist[id] = isChecked;
                localStorage.setItem('vibeChecklist', JSON.stringify(state.checklist));
                uiHelpers.updateChecklistProgress();
            },

            copyToClipboard: (elementId) => {
                const preElement = document.getElementById(elementId);
                // Extract raw text, replacing common HTML entities back to raw form if necessary
                const text = preElement.innerText || preElement.textContent;
                
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(text).then(app.showToast).catch(err => app.fallbackCopy(text));
                } else {
                    app.fallbackCopy(text);
                }
            },

            fallbackCopy: (text) => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.opacity = "0";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    app.showToast();
                } catch (err) {
                    console.error('Copy failed', err);
                }
                document.body.removeChild(textArea);
            },

            showToast: () => {
                const toast = document.getElementById('toast');
                toast.classList.remove('translate-y-20', 'opacity-0');
                setTimeout(() => {
                    toast.classList.add('translate-y-20', 'opacity-0');
                }, 2500);
            },

            setupMobileMenu: () => {
                const btn = document.getElementById('mobileMenuBtn');
                const overlay = document.getElementById('sidebarOverlay');
                btn.addEventListener('click', () => app.toggleMobileMenu());
                overlay.addEventListener('click', () => app.toggleMobileMenu(false));
            },

            toggleMobileMenu: (forceState) => {
                const sidebar = document.getElementById('sidebar');
                const overlay = document.getElementById('sidebarOverlay');
                const isCurrentlyClosed = sidebar.classList.contains('-translate-x-full');
                
                const open = forceState !== undefined ? forceState : isCurrentlyClosed;

                if (open) {
                    sidebar.classList.remove('-translate-x-full');
                    overlay.classList.remove('hidden');
                    document.body.classList.add('menu-open'); // Scroll lock
                } else {
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                    document.body.classList.remove('menu-open');
                }
            }
        };

        // Initialize application on load
        document.addEventListener('DOMContentLoaded', app.init);
    </script>
</body>
</html>
