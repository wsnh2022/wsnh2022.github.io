                    <div class="fade-in flex flex-col gap-12">
                        <div>
                            <h1 class="text-4xl lg:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-zinc-100 via-zinc-300 to-zinc-500 tracking-tight mb-4 leading-tight">The Vibe Coding Blueprint</h1>
                            <p class="text-lg lg:text-xl text-zinc-400 font-light leading-relaxed max-w-2xl">The Complete Documentation System for Building Apps With AI.</p>
                        </div>
                        
                        <div class="markdown-body">
                            <h2>The Core Problem</h2>
                            <p>Vibe coding makes it incredibly easy to go from an idea to working software. You describe what you want. AI writes the code. You run it. You fix something. You ask AI to change it. Repeat. And this works surprisingly well for small experiments.</p>
                            <p>But as your application becomes more complex, a different problem appears:</p>
                            <blockquote class="text-lg">
                                <strong>Your AI coding agent starts guessing.</strong><br>
                                <span class="text-zinc-400 text-base mt-2 block">It guesses what a feature should do. It guesses how the UI should look. It guesses how your database should work. It guesses how authentication should work. It guesses where a file belongs. It guesses how the API should behave.</span>
                            </blockquote>
                            <p>And eventually, different parts of your application start following different assumptions. That's where documentation becomes extremely powerful.</p>
                            <p>The goal of this guide is simple: <strong>Give your AI coding agent enough context that it spends less time guessing and more time implementing.</strong></p>
                            
                            <h2>The Mental Model</h2>
                            <p>Don't just give AI a prompt. Give AI: <strong>Context + Rules + Constraints + Architecture + Examples + Validation</strong>.</p>
                            
                            <div class="glass-panel p-8 my-10 rounded-2xl relative overflow-hidden group hover:border-brand-500/20 transition-colors duration-500">
                                <div class="absolute top-0 left-0 w-full h-px bg-gradient-to-r from-transparent via-brand-500/50 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                                <div class="flex flex-wrap justify-center gap-2 items-center font-mono text-xs font-medium">
                                    <span class="text-zinc-300 bg-black/40 border border-white/10 px-3 py-1.5 rounded-md">Idea</span> 
                                    <i class="ph ph-caret-right text-zinc-600"></i>
                                    <span class="text-zinc-300 bg-black/40 border border-white/10 px-3 py-1.5 rounded-md">Context (Docs)</span>
                                    <i class="ph ph-caret-right text-zinc-600"></i>
                                    <span class="text-zinc-300 bg-black/40 border border-white/10 px-3 py-1.5 rounded-md">Plan</span> 
                                    <i class="ph ph-caret-right text-zinc-600"></i>
                                    <span class="text-zinc-300 bg-black/40 border border-white/10 px-3 py-1.5 rounded-md">Code</span> 
                                    <i class="ph ph-caret-right text-zinc-600"></i>
                                    <span class="text-zinc-300 bg-black/40 border border-white/10 px-3 py-1.5 rounded-md">Validate</span> 
                                    <i class="ph ph-caret-right text-zinc-600"></i>
                                    <span class="text-brand-cyan bg-brand-cyan/10 border border-brand-cyan/20 px-4 py-1.5 rounded-md shadow-glow-cyan">Ship 🚀</span>
                                </div>
                            </div>

                            <h2>The Most Important Principle</h2>
                            <p>Documentation is <strong>not bureaucracy</strong>. The purpose isn't to write hundreds of pages nobody reads. The purpose is to eliminate ambiguity.</p>
                            <p>A good document should help answer:</p>
                            <ul>
                                <li><strong>What should happen?</strong></li>
                                <li><strong>Why should it happen?</strong></li>
                                <li><strong>How should it work?</strong></li>
                                <li><strong>What constraints exist?</strong></li>
                                <li><strong>What should the AI never assume?</strong></li>
                                <li><strong>How do we know it works?</strong></li>
                            </ul>
                            <p>That's the real value of documentation in AI-assisted development.</p>

                            <h2>The 8 Core Documents</h2>
                            <p>Start with these eight files in your <code>/docs</code> folder. They form the foundation of truth for any AI agent.</p>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-8">
                                ${Object.keys(docTemplates).slice(0, 8).map((key, i) => `
                                    <div onclick="app.navigate('${key}')" style="animation-delay: ${i * 50}ms" class="fade-in glass-panel p-5 rounded-xl cursor-pointer hover:-translate-y-1 hover:border-brand-400/40 hover:bg-white/5 transition-all duration-300 group relative overflow-hidden">
                                        <div class="absolute -right-4 -top-4 w-16 h-16 bg-brand-400/10 rounded-full blur-xl group-hover:bg-brand-400/20 transition-colors"></div>

                                        <div class="text-zinc-100 font-medium tracking-tight mb-1 group-hover:text-brand-300 transition-colors">${docTemplates[key].title}</div>
                                        <div class="text-zinc-500 text-xs leading-relaxed">${docTemplates[key].desc}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `
            },
            'prompts': {
                type: 'html',

                    <div class="fade-in markdown-body">
                        <h1>AI Interaction Prompts</h1>
                        <p>Copy and paste these master prompts into your AI coding environment to establish context and workflow.</p>
                        
                        <h2>1. The Master Agent Prompt</h2>
                        <p>Use this as a general starting prompt or place it in your agent's system instructions (highly optimized for Claude).</p>
                        ${uiHelpers.createCodeBlock('master_agent_prompt.txt', `You are an expert developer powered by Claude. 
Before writing any code, you MUST ingest the context from our documentation folder.

<documentation_map>
- <prd>: Read \`docs/PRD.md\` for product requirements.
- <design>: Read \`docs/DESIGN_SYSTEM.md\` for visual styling.
- <architecture>: Read \`docs/ARCHITECTURE.md\` for file structure and patterns.
- <database>: Read \`docs/DATABASE.md\` before making schema changes.
- <security>: Read \`docs/SECURITY.md\` for authentication and data protection.
- <style>: Read \`docs/CODE_STYLE.md\` for coding conventions.
- <testing>: Read \`docs/TESTING.md\` for validation rules.
</documentation_map>

<output_rules>
- NEVER apologize.
- NEVER say "I understand" or "Here is the code".
- Do not explain your thought process unless explicitly asked.
- Provide only the requested code, plans, or direct answers.
- When generating code, output the complete file without skipping lines. Do not use comments like \`// ... existing code ...\` unless explicitly told to do so.
</output_rules>

Before implementing a non-trivial change:
1. Review the relevant documents in the <documentation_map>.
2. Inspect the existing implementation.
3. Identify affected files, dependencies, and tests.
4. Create an implementation plan.

After the plan is approved, implement the smallest correct change adhering to the rules.

If something important is undefined or requirements conflict, do not guess. Ask for clarification.`)}

                        <h2>2. Project Bootstrap Prompt</h2>

Do not start coding yet.

First, help me create the project documentation.
Create the following documentation:

1. PRD.md
2. DESIGN_SYSTEM.md
3. UX_FLOWS.md
4. ARCHITECTURE.md
5. DATABASE.md
6. API.md
7. SECURITY.md
8. CODE_STYLE.md
9. TESTING.md
10. AGENTS.md

For each document:
- Clearly explain its purpose
- Identify assumptions
- Identify unresolved questions
- Keep requirements explicit
- Avoid inventing business decisions
- Reuse decisions consistently across documents

Start with PRD.md.
Ask me only the questions that are necessary to define the product correctly.
Do not generate application code until the documentation has been reviewed and approved.`)}

                        <h2>3. Feature Implementation Prompt</h2>

2. Identify which documents are affected.
3. Inspect the existing implementation.

Do not modify unrelated parts of the project.

- Architecture violations
- Duplicate logic

- Database issues
- API inconsistencies
- Accessibility issues
- Responsive UI issues
- Error handling issues
- Missing loading/empty/error states
- Missing tests
- Regressions
- Unnecessary dependencies
- Unintended file changes

Compare the implementation against /docs.

Do not modify anything yet.

First provide:
1. Findings
2. Severity
3. Recommended fixes
4. Documentation that should be updated`)}

<documentation_map>

---

## 3. Output & Behavior Rules
<output_rules>
- NEVER apologize.
- NEVER say "I understand" or "Here is the code".
- Do not explain your thought process unless explicitly asked.
- Provide only the requested code, plans, or direct answers.
- When generating code, output the complete file without skipping lines unless explicitly told otherwise.
- Avoid modifying unrelated files.
- Do not invent business requirements or database fields.
</output_rules>

---

## 4. Planning
Before implementing a non-trivial task:
1. Inspect relevant documentation in the <documentation_map>.

3. Identify affected files, dependencies, database/API changes, and tests required.
4. Create a concise implementation plan.

---

## 5. Implementation
During implementation:
- Make focused changes.
- Reuse established patterns and existing components.
- Preserve existing behavior.
- Keep code maintainable.

---

## 6. Validation
After implementation:
1. Run tests.
2. Run linting and type checking.
3. Run the build.
4. Review changed files for unintended modifications.

---

## 7. Conflict Handling
If requirements conflict:
Do not guess.
Identify the conflict and explicitly ask the user for clarification.

---

## 8. Completion Criteria
A task is complete only when:
- Requirements are satisfied.

- Security rules are respected.

                if(completed === total && total > 0) {
                    document.getElementById('checklistProgress').classList.add('bg-emerald-500/20', 'text-emerald-400');
                    document.getElementById('checklistProgress').classList.remove('bg-surface-800', 'text-slate-300');
                } else {
                    document.getElementById('checklistProgress').classList.remove('bg-emerald-500/20', 'text-emerald-400');
                    document.getElementById('checklistProgress').classList.add('bg-surface-800', 'text-slate-300');
                }
            }
        };

        const app = {
            init: () => {
                app.buildSidebar();
                app.navigate(state.activeView);
                uiHelpers.updateChecklistProgress();
                app.setupMobileMenu();
            },

            buildSidebar: () => {
                const coreNav = document.getElementById('navGroupCore');
                const advNav = document.getElementById('navGroupAdvanced');
                
                let coreHtml = '';
                let advHtml = '';

                Object.keys(docTemplates).forEach((key, index) => {
                    const doc = docTemplates[key];
                    const btnHtml = `
                        <button onclick="app.navigate('${key}')" id="nav-${key}" class="nav-link w-full flex items-center gap-3 px-3 py-3 lg:py-2 text-sm font-medium rounded-lg text-zinc-400 hover:text-zinc-100 hover:bg-white/5 transition-all text-left group relative">
                            <div class="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-0 bg-brand-400 rounded-r-full transition-all duration-300 nav-indicator"></div>
                            <span class="text-[9px] font-mono bg-black/30 border border-white/5 px-1.5 py-0.5 rounded text-zinc-500 group-hover:text-brand-400 transition-colors shrink-0">${doc.id}</span>
                            <span class="truncate tracking-tight">${doc.title}</span>
                        </button>
                    `;
                    if (index < 8) coreHtml += btnHtml;
                    else advHtml += btnHtml;
                });

                coreNav.innerHTML = coreHtml;
                advNav.innerHTML = advHtml;
            },

            navigate: (viewId) => {
                state.activeView = viewId;
                
                // Update active state in sidebar
                document.querySelectorAll('.nav-link').forEach(el => {
                    el.classList.remove('bg-brand-500/10', 'text-brand-300', 'active');
                    el.classList.add('text-zinc-400');
                    el.querySelector('.nav-indicator').classList.remove('h-4');
                    el.querySelector('.nav-indicator').classList.add('h-0');
                });
                const activeLink = document.getElementById(`nav-${viewId}`);
                if (activeLink) {
                    activeLink.classList.remove('text-zinc-400');
                    activeLink.classList.add('bg-brand-500/10', 'text-brand-300', 'active');
                    activeLink.querySelector('.nav-indicator').classList.remove('h-0');
                    activeLink.querySelector('.nav-indicator').classList.add('h-4');
                }

                // Render Content
                const stage = document.getElementById('contentStage');
                const scrollArea = document.getElementById('mainScroll');
                
                // Check if view is a document template
                if (docTemplates[viewId]) {
                    const doc = docTemplates[viewId];
                    stage.innerHTML = `
                        <div class="fade-in markdown-body pb-12">
                            <div class="mb-8 flex items-center gap-4">
                                <span class="bg-gradient-to-br from-brand-500 to-brand-cyan text-white shadow-glow font-mono font-bold px-2.5 py-1 rounded-md text-xs tracking-wider">${doc.id}</span>
                                <h1 class="!mb-0 !mt-0 !text-3xl">${doc.title}</h1>
                            </div>
                            <p class="text-lg text-zinc-400 border-l-2 border-brand-500/50 pl-5 mb-10 leading-relaxed font-light">${doc.desc}</p>
                            ${uiHelpers.createCodeBlock(doc.title, doc.content)}
                        </div>
                    `;
                } else if (contentDB[viewId]) {
                    // Render static view
                    stage.innerHTML = contentDB[viewId].render();
                    if(viewId === 'checklist') app.renderChecklist();
                }

                // Reset scroll and close mobile menu if open
                scrollArea.scrollTop = 0;
                if (window.innerWidth < 1024) {
                    app.toggleMobileMenu(false);
                }
            },

            renderChecklist: () => {
                const container = document.getElementById('checklistContainer');
                if(!container) return;
                
                let html = '';
                checklistData.forEach((group, groupIndex) => {
                    html += `
                        <div class="glass-panel rounded-2xl p-6 fade-in" style="animation-delay: ${groupIndex * 50}ms">
                            <h3 class="text-brand-400 font-bold mb-5 uppercase tracking-[0.15em] text-xs flex items-center gap-2">
                                <i class="ph-duotone ph-target"></i> ${group.title}
                            </h3>
                            <div class="space-y-1">
                    `;
                    group.items.forEach(item => {
                        const isChecked = state.checklist[item.id] ? 'checked' : '';
                        const textClass = isChecked ? 'text-zinc-600 line-through' : 'text-zinc-300';
                        html += `
                            <label class="group flex items-start gap-4 cursor-pointer p-2 -mx-2 rounded-lg hover:bg-white/5 transition-colors">
                                <div class="relative flex items-center justify-center w-5 h-5 mt-0.5 rounded border border-white/20 bg-black/40 transition-colors duration-300 ${isChecked ? 'bg-brand-500 border-brand-500 shadow-glow' : 'group-hover:border-white/40'}">
                                    <input type="checkbox" id="${item.id}" class="task-checkbox" ${isChecked} onchange="app.toggleChecklist('${item.id}', this, this.nextElementSibling)">
                                    ${isChecked ? '<i class="ph-bold ph-check text-white text-xs"></i>' : ''}
                                </div>
                                <span class="text-sm select-none transition-all duration-300 ${textClass}">${item.label}</span>
                            </label>
                        `;
                    });
                    html += `</div></div>`;
                });
                container.innerHTML = html;
            },

            toggleChecklist: (id, inputEl, textEl) => {
                const isChecked = inputEl.checked;
                state.checklist[id] = isChecked;
                localStorage.setItem('vibeChecklist', JSON.stringify(state.checklist));
                uiHelpers.updateChecklistProgress();
                
                // Re-render the specific group to update the checkmark SVG smoothly
                app.renderChecklist();
            },

            copyToClipboard: (elementId) => {
                const preElement = document.getElementById(elementId);
                // Extract raw text, replacing common HTML entities back to raw form if necessary
                const text = preElement.innerText || preElement.textContent;
                
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(text).then(app.showToast).catch(err => app.fallbackCopy(text));
                } else {
                    app.fallbackCopy(text);
                }
            },

            fallbackCopy: (text) => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.opacity = "0";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    app.showToast();
                } catch (err) {
                    console.error('Copy failed', err);
                }
                document.body.removeChild(textArea);
            },

            showToast: () => {
                const toast = document.getElementById('toast');
                toast.classList.remove('translate-y-20', 'opacity-0');
                setTimeout(() => {
                    toast.classList.add('translate-y-20', 'opacity-0');
                }, 2500);
            },

            setupMobileMenu: () => {
                const btn = document.getElementById('mobileMenuBtn');
                const overlay = document.getElementById('sidebarOverlay');
                btn.addEventListener('click', () => app.toggleMobileMenu());
                overlay.addEventListener('click', () => app.toggleMobileMenu(false));
            },

            toggleMobileMenu: (forceState) => {
                const sidebar = document.getElementById('sidebar');
                const overlay = document.getElementById('sidebarOverlay');
                const isCurrentlyClosed = sidebar.classList.contains('-translate-x-full');
                
                const open = forceState !== undefined ? forceState : isCurrentlyClosed;

                if (open) {
                    sidebar.classList.remove('-translate-x-full');
                    overlay.classList.remove('hidden');
                    document.body.classList.add('menu-open'); // Scroll lock
                } else {
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                    document.body.classList.remove('menu-open');
                }
            }
        };

        // Initialize application on load
        document.addEventListener('DOMContentLoaded', app.init);
    </script>
</body>
</html>
